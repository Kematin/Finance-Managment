[project]
name = "personal-finance-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gspread==6.1.4",
    "google-auth==2.35.0",
    "python-dotenv==1.0.1",
    "aiogram==3.30.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
